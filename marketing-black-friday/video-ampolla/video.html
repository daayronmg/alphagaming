<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#07070A;font-family:'Inter','Noto Color Emoji',sans-serif}
#st{position:absolute;inset:0;overflow:hidden}
.glow{position:absolute;width:1300px;height:1300px;left:-110px;top:420px;border-radius:50%;background:radial-gradient(rgba(243,200,90,.38),transparent 62%)}
#prod{position:absolute;left:90px;top:520px;width:900px;height:874px;background:url(ampolla.jpg) center/cover;
 -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 72%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 55%,transparent 72%)}
.cap{position:absolute;left:60px;right:60px;top:230px;text-align:center;font-weight:800;font-size:78px;line-height:1.15;color:#fff;letter-spacing:-1px}
.cap .w{display:inline-block;margin:0 10px;opacity:0;transform:translateY(30px)}
.cap .hl{background:#F3D27A;color:#111;padding:0 14px;border-radius:14px}
.badge{position:absolute;background:#fff;color:#111;font-weight:800;font-size:46px;padding:20px 34px;border-radius:60px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;white-space:nowrap}
.gold{background:#F3D27A}
.pill{position:absolute;left:50%;font-weight:900;font-size:56px;padding:22px 44px;border-radius:24px;white-space:nowrap;opacity:0}
.big{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:900;opacity:0}
.wm{position:absolute;right:50px;bottom:60px;color:#fff;opacity:.55;font-weight:800;font-size:30px;text-align:center}
</style></head><body><div id="st">
<div class="glow" id="glow"></div><div id="prod"></div>
<div class="cap" id="cap"></div>
<div class="badge" id="b1"></div><div class="badge" id="b2"></div><div class="badge" id="b3"></div>
<div class="big" id="count" style="top:1440px;font-size:150px;color:#F3D27A"></div>
<div class="big" id="sub" style="top:1610px;font-size:56px"></div>
<div class="pill" id="p1" style="background:#fff;color:#111;top:1440px"></div>
<div class="pill" id="p2" style="background:#FE2C55;color:#fff;top:1600px"></div>

</div>
<script>
const S=[ // scenes: [start,end,caption words (hl with *), product transform fn]
 {s:0,e:2.8,cap:['¿Qué','son','esos','*hilos','*dorados?','👀']},
 {s:2.8,e:5.6,cap:['Es','una','*ampolla','de','*colágeno']},
 {s:5.6,e:8.6,cap:['Hidrata','y','deja','*glow','✨']},
 {s:8.6,e:11.4,cap:['Con','*jeringa','dosificadora']},
 {s:11.4,e:14.2,cap:['Y','ya','van…']},
 {s:14.2,e:18,cap:['Por','*Black','*Friday']}];
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const pop=(t,t0,d=.35)=>{const k=ease((t-t0)/d);return k};
function setCap(sc,t){const c=document.getElementById('cap');
 if(c.dataset.k!=sc.s){c.dataset.k=sc.s;c.innerHTML=sc.cap.map(w=>w[0]=='*'?`<span class="w"><span class="hl">${w.slice(1)}</span></span>`:`<span class="w">${w}</span>`).join(' ')}
 [...c.children].forEach((el,i)=>{const k=pop(t,sc.s+0.12*i,.3);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*30}px)`})}
function badge(id,txt,cls,x,y,t,t0,t1){const b=document.getElementById(id);b.textContent=txt;b.className='badge '+cls;
 const k=pop(t,t0,.3), out=t>t1?1-ease((t-t1)/.25):1; b.style.opacity=k*out; b.style.left=x+'px';b.style.top=y+'px';b.style.transform=`scale(${.6+.4*k})`}
function hide(...ids){ids.forEach(i=>document.getElementById(i).style.opacity=0)}
window.render=function(t){
 const sc=S.find(x=>t>=x.s&&t<x.e)||S[S.length-1]; setCap(sc,t);
 const p=document.getElementById('prod'); let sc0=1,tx=0,ty=0;
 hide('b1','b2','b3','count','sub','p1','p2');
 const fl=Math.sin(t*2)*12;
 if(sc.s==0){sc0=1.05+0.25*ease(t/2.8);ty=fl}
 else if(sc.s==2.8){sc0=1;ty=fl;badge('b1','💧 55 ml','',110,1380,t,3.4,5.3);badge('b2','Seda hidrolizada','gold',520,1470,t,3.8,5.3)}
 else if(sc.s==5.6){sc0=.92;ty=fl;badge('b1','✔ Hidratación profunda','',90,1390,t,6.1,8.3);badge('b2','✔ Nutre y calma','gold',300,1500,t,6.6,8.3);badge('b3','✔ Piel jugosa','',560,1610,t,7.1,8.3)}
 else if(sc.s==8.6){sc0=1.55;tx=-230;ty=-60+fl;badge('b1','sin aguja 😅','gold',580,1430,t,9.3,11.2)}
 else if(sc.s==11.4){sc0=.85;ty=-60+fl;const k=ease((t-11.6)/1.6);const c=document.getElementById('count');c.style.opacity=pop(t,11.5);c.textContent=String(Math.round(4533*k)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
   const s=document.getElementById('sub');s.style.opacity=pop(t,12.4);s.textContent='vendidas · 4,4 ⭐'}
 else {sc0=.85;ty=-80+fl;const a=document.getElementById('p1');a.style.opacity=pop(t,14.6);a.innerHTML='🏷️ Descuento Black Friday';a.style.transform=`translateX(-50%) rotate(-3deg) scale(${.7+.3*pop(t,14.6)})`;
   const b=document.getElementById('p2');b.style.opacity=pop(t,15.4);b.innerHTML='<s style="opacity:.7;font-weight:600">20€</s>&nbsp; 11,82€ en TikTok Shop';b.style.transform=`translateX(-50%) scale(${.7+.3*pop(t,15.4)})`}
 p.style.transform=`translate(${tx}px,${ty}px) scale(${sc0*1.15})`;
 document.getElementById('glow').style.opacity=.75+.25*Math.sin(t*1.5);
}
render(0);
</script></body></html>
