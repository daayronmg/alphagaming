<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#0A0A0E;font-family:'Inter','Noto Color Emoji',sans-serif}
#st{position:absolute;inset:0;overflow:hidden}
.glow{position:absolute;width:1400px;height:1400px;left:-160px;top:300px;border-radius:50%;background:radial-gradient(rgba(243,200,90,.30),transparent 60%)}
svg{position:absolute;left:0;top:0}
.cap{position:absolute;left:60px;right:60px;top:230px;text-align:center;font-weight:700;font-size:70px;line-height:1.25;color:#fff;z-index:5;text-shadow:0 0 4px #000,0 0 4px #000,0 3px 10px #000}
.cap .w{display:inline-block;margin:0 9px;opacity:0}
.cap .hl{color:#F3D27A}
.badge{position:absolute;background:#fff;color:#111;font-weight:800;font-size:46px;padding:20px 34px;border-radius:60px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;white-space:nowrap;z-index:6}
.gold{background:#F3D27A}
.pill{position:absolute;left:50%;font-weight:900;font-size:56px;padding:22px 44px;border-radius:24px;white-space:nowrap;opacity:0;z-index:6}
.big{position:absolute;left:0;right:0;text-align:center;color:#fff;font-weight:900;opacity:0;z-index:6}
</style></head><body><div id="st">
<div class="glow" id="glow"></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
 <linearGradient id="glass" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".25" stop-color="#fff" stop-opacity=".08"/><stop offset=".8" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/></linearGradient>
 <linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4D6" stop-opacity=".55"/><stop offset="1" stop-color="#F3D27A" stop-opacity=".55"/></linearGradient>
 <linearGradient id="capg" x1="0" x2="1"><stop offset="0" stop-color="#8d8d95"/><stop offset=".45" stop-color="#e9e9ef"/><stop offset="1" stop-color="#7a7a82"/></linearGradient>
 <clipPath id="bclip"><path d="M-50,-110 L50,-110 L60,-80 Q150,-60 150,0 L150,260 Q150,300 110,300 L-110,300 Q-150,300 -150,260 L-150,0 Q-150,-60 -60,-80 Z"/></clipPath>
 <clipPath id="sclip"><rect x="-26" y="-230" width="52" height="300" rx="10"/></clipPath>
 <radialGradient id="shine"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>

<!-- WOMAN -->
<g id="woman">
 <path d="M300,1560 Q540,1380 780,1560 L840,1920 L240,1920 Z" fill="#E9A6B8"/>
 <rect x="490" y="1180" width="100" height="160" rx="40" id="neck" fill="#E2BFA0"/>
 <path id="hairback" d="M300,900 Q300,620 540,610 Q780,620 780,900 L800,1420 Q540,1470 280,1420 Z" fill="#5A3A26"/>
 <ellipse id="earL" cx="312" cy="960" rx="34" ry="52" fill="#E2BFA0"/>
 <ellipse id="earR" cx="768" cy="960" rx="34" ry="52" fill="#E2BFA0"/>
 <ellipse id="head" cx="540" cy="940" rx="232" ry="275" fill="#E2BFA0"/>
 <ellipse id="hl" cx="430" cy="1010" rx="70" ry="45" fill="url(#shine)" opacity="0"/>
 <ellipse id="hl2" cx="650" cy="1010" rx="70" ry="45" fill="url(#shine)" opacity="0"/>
 <g id="dry" stroke="#C9A98C" stroke-width="5" stroke-linecap="round" fill="none">
  <path d="M390,1030 l25,-8 M400,1055 l30,-6 M620,1035 l28,-6 M640,1062 l24,-8 M520,860 l30,0 M545,880 l20,0"/></g>
 <ellipse id="blL" cx="420" cy="1040" rx="58" ry="32" fill="#FF8FA3" opacity="0"/>
 <ellipse id="blR" cx="660" cy="1040" rx="58" ry="32" fill="#FF8FA3" opacity="0"/>
 <path d="M420,880 q40,-26 80,-6" stroke="#4A2E1E" stroke-width="12" stroke-linecap="round" fill="none" id="browL"/>
 <path d="M580,874 q40,-20 80,6" stroke="#4A2E1E" stroke-width="12" stroke-linecap="round" fill="none" id="browR"/>
 <g id="eyes">
  <ellipse cx="455" cy="955" rx="46" ry="54" fill="#fff"/><ellipse cx="625" cy="955" rx="46" ry="54" fill="#fff"/>
  <circle id="pL" cx="460" cy="962" r="26" fill="#2B1B12"/><circle id="pR" cx="630" cy="962" r="26" fill="#2B1B12"/>
  <circle cx="470" cy="950" r="9" fill="#fff"/><circle cx="640" cy="950" r="9" fill="#fff"/>
  <rect id="lidL" x="405" y="895" width="100" height="0" fill="#E2BFA0"/><rect id="lidR" x="575" y="895" width="100" height="0" fill="#E2BFA0"/>
 </g>
 <path d="M540,990 q-12,40 6,48" stroke="#C9A285" stroke-width="7" fill="none" stroke-linecap="round"/>
 <path id="mouth" d="M500,1100 Q540,1080 580,1100" stroke="#B4535F" stroke-width="12" fill="none" stroke-linecap="round"/>
 <path id="hairfront" d="M300,900 Q310,640 540,630 Q760,640 780,880 Q700,760 560,740 Q470,800 330,830 Z" fill="#6B4630"/>
 <g id="spark" fill="#FFE9A8" opacity="0">
  <path id="s1" d="M0,-30 L8,-8 L30,0 L8,8 L0,30 L-8,8 L-30,0 L-8,-8 Z" transform="translate(360,880)"/>
  <path id="s2" d="M0,-24 L6,-6 L24,0 L6,6 L0,24 L-6,6 L-24,0 L-6,-6 Z" transform="translate(720,960)"/>
  <path id="s3" d="M0,-20 L5,-5 L20,0 L5,5 L0,20 L-5,5 L-20,0 L-5,-5 Z" transform="translate(600,1110)"/>
  <path id="s4" d="M0,-26 L7,-7 L26,0 L7,7 L0,26 L-7,7 L-26,0 L-7,-7 Z" transform="translate(470,1150)"/>
 </g>
</g>

<!-- AMPOULE -->
<g id="amp">
 <rect x="-60" y="-200" width="120" height="70" rx="12" fill="url(#capg)"/>
 <rect x="-50" y="-135" width="100" height="30" fill="#ddd" opacity=".5"/>
 <path d="M-50,-110 L50,-110 L60,-80 Q150,-60 150,0 L150,260 Q150,300 110,300 L-110,300 Q-150,300 -150,260 L-150,0 Q-150,-60 -60,-80 Z" fill="url(#liq)" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>
 <g clip-path="url(#bclip)" id="threads" stroke="#D9A520" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"></g>
 <path d="M-50,-110 L50,-110 L60,-80 Q150,-60 150,0 L150,260 Q150,300 110,300 L-110,300 Q-150,300 -150,260 L-150,0 Q-150,-60 -60,-80 Z" fill="url(#glass)"/>
 <rect x="-130" y="40" width="260" height="190" fill="#fff"/>
 <text x="-112" y="92" font-family="Georgia,serif" font-weight="700" font-size="34" fill="#111">Deep Collagen</text>
 <text x="-112" y="128" font-family="Inter" font-size="20" fill="#333">Silk Peptide</text>
 <text x="-112" y="152" font-family="Inter" font-size="20" fill="#333">Intensive Ampoule</text>
 <rect x="-112" y="166" width="62" height="32" rx="4" fill="#F3D27A"/><text x="-104" y="190" font-family="Inter" font-weight="700" font-size="20" fill="#111">SILK</text>
</g>

<!-- SYRINGE -->
<g id="syr">
 <rect x="-8" y="70" width="16" height="70" rx="6" fill="#e8e8ee" opacity=".9"/>
 <g clip-path="url(#sclip)"><rect id="sliq" x="-26" y="70" width="52" height="0" fill="url(#liq)"/><g id="sfleck" fill="#D9A520"></g></g>
 <rect x="-26" y="-230" width="52" height="300" rx="10" fill="url(#glass)" stroke="#fff" stroke-opacity=".7" stroke-width="3"/>
 <rect x="-50" y="-240" width="100" height="14" rx="6" fill="#ddd"/>
 <g id="plunger"><rect x="-9" y="-330" width="18" height="300" fill="#e8e8ee" opacity=".85"/><rect x="-22" y="-60" width="44" height="22" rx="4" fill="#222"/><rect x="-40" y="-342" width="80" height="14" rx="6" fill="#e8e8ee"/></g>
</g>
<g id="drops" fill="#FFE7A0"></g>
</svg>
<svg width="1080" height="1920" viewBox="0 0 1080 1920" style="z-index:3">
<g id="worm"><g id="wb"></g><circle id="weye" r="7" fill="#333"/></g>
<g id="coc"><ellipse rx="120" ry="80" fill="#FFF6E0"/><g stroke="#E8D9B0" stroke-width="4" fill="none">
 <path d="M-100,-30 Q0,-80 100,-30"/><path d="M-115,0 Q0,-50 115,0"/><path d="M-110,30 Q0,-20 110,30"/><path d="M-90,55 Q0,10 90,55"/></g></g>
<path id="thread" fill="none" stroke="#F3D27A" stroke-width="9" stroke-linecap="round"/>
<g id="flecks" fill="#F3D27A"></g>
</svg>
<div class="cap" id="cap"></div>
<div class="big" id="meter" style="top:1500px;font-size:130px;color:#F3D27A"></div>
<div class="big" id="small" style="top:1700px;font-size:44px;font-weight:700;opacity:0"></div>
</div><script>
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const th=$('threads');for(let i=0;i<14;i++){const p=document.createElementNS(NS,'path');p.dataset.i=i;th.appendChild(p)}
const wb=$('wb');for(let i=0;i<7;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('r',34-i*2);c.setAttribute('fill',i%2?'#F4EBD6':'#FBF4E4');c.setAttribute('stroke','#E2D3B0');c.setAttribute('stroke-width',3);wb.appendChild(c)}
const fk=$('flecks');for(let i=0;i<40;i++){const r=document.createElementNS(NS,'rect');r.setAttribute('width',16);r.setAttribute('height',5);r.setAttribute('rx',2);fk.appendChild(r)}
const S=[
 {s:0,e:3,cap:['me','estoy','echando','*gusanos','en','la','cara','🐛']},
 {s:3,e:5,cap:['bueno…','lo','que','*fabrican','ellos']},
 {s:5,e:8.5,cap:['cada','capullo','es','*UN','*solo','*hilo']},
 {s:8.5,e:11.5,cap:['de','ese','hilo','sacan','*proteínas','*de','*seda']},
 {s:11.5,e:15,cap:['que','ayudan','a','tu','piel','a','*retener','*la','*hidratación','💧']},
 {s:15,e:18.5,cap:['por','eso','esta','ampolla','tiene','*hilos','*dorados','flotando']},
 {s:18.5,e:24,cap:['y','la','piel','queda','*jugosa','y','con','*glow','✨']}];
const cl=x=>x<0?0:x>1?1:x, ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)}, back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, lerp=(a,b,k)=>a+(b-a)*k;
const mix=(c1,c2,k)=>{const h=s=>[1,3,5].map(i=>parseInt(s.substr(i,2),16));const a=h(c1),b=h(c2);return 'rgb('+a.map((v,i)=>Math.round(lerp(v,b[i],k))).join(',')+')'};
function setCap(sc,t){const c=$('cap');if(c.dataset.k!=sc.s){c.dataset.k=sc.s;c.innerHTML=sc.cap.map(w=>w[0]=='*'?`<span class="w"><span class="hl">${w.slice(1)}</span></span>`:`<span class="w">${w}</span>`).join(' ')}
 [...c.children].forEach((el,i)=>{const k=ease((t-sc.s-0.09*i)/.25);el.style.opacity=k;el.style.transform=`translateY(${(1-k)*24}px)`})}
function tf(id,x,y,s,r=0,o=1){const g=$(id);g.setAttribute('transform',`translate(${x},${y}) rotate(${r}) scale(${s})`);g.setAttribute('opacity',o)}
function worm(x,y,s,o,t){tf('worm',x,y,s,0,o);[...wb.children].forEach((c,i)=>{c.setAttribute('cx',-i*46);c.setAttribute('cy',Math.sin(t*6-i*.8)*10)});$('weye').setAttribute('cx',12);$('weye').setAttribute('cy',-8+Math.sin(t*6)*10)}
window.render=function(t){
 const sc=S.find(x=>t>=x.s&&t<x.e)||S[S.length-1];setCap(sc,t);
 [...th.children].forEach(p=>{const i=+p.dataset.i,y=-90+i*28,ph=t*2+i;p.setAttribute('d',`M-140,${y+Math.sin(ph)*14} C-60,${y-40+Math.cos(ph)*20} 20,${y+40+Math.sin(ph*1.3)*20} 140,${y+Math.cos(ph)*14}`)});
 let W={x:0,y:0,s:1,o:0},A={x:0,y:0,s:0,o:0},glowK=0,fill=0;const fl=Math.sin(t*2.2)*10;
 let wo=0,co=0,thr=0,fo=0;$('meter').style.opacity=0;$('small').style.opacity=0;
 tf('syr',0,0,1,0,0);
 if(sc.s==0){W={x:-150,y:120,s:.85,o:1};A={x:780,y:1080+fl,s:.9,o:1};wo=back((t-1.2)/.5);worm(lerp(1200,860,ease((t-1.2)/.8)),720,1.3,wo,t)}
 else if(sc.s==3){const k=ease((t-3)/.5);W={x:-150-600*k,y:120,s:.85,o:1-k};A={x:780+500*k,y:1080,s:.9,o:1-k};
   worm(lerp(820,640,k),1000,1.4,1,t);co=ease((t-4)/.8);tf('coc',540,1000,1.5*co,0,co)}
 else if(sc.s==5){tf('coc',lerp(540,250,ease((t-5)/.6)),900,1.2,0,1);thr=ease((t-5.4)/2.6);
   const pts=[];for(let i=0;i<=60;i++){const u=i/60*thr;pts.push(`${lerp(250,1000,u)+Math.sin(u*30)*20},${900+Math.sin(u*14)*260*u}`)}$('thread').setAttribute('d','M'+pts.join(' L'));$('thread').setAttribute('opacity',1);
   const m=$('meter');m.style.opacity=cl((t-6)/.3);m.textContent=Math.round(1500*ease((t-6)/2))+' m';const s=$('small');s.style.opacity=cl((t-6.5)/.3);s.textContent='hasta 1,5 km de hilo en un solo capullo'}
 else if(sc.s==8.5){tf('coc',250,900,1.2,0,1-ease((t-8.5)/.5));fo=1;$('thread').setAttribute('opacity',1-ease((t-8.6)/.5));
   [...fk.children].forEach((r,i)=>{const u=i/40,k=ease((t-8.6-u*.6)/1);r.setAttribute('x',lerp(250+u*750,540+Math.sin(i)*300,k)+Math.sin(t*2+i)*10);r.setAttribute('y',lerp(900+Math.sin(u*14)*260*u,800+Math.cos(i*1.7)*300,k));r.setAttribute('transform',`rotate(${i*37+t*40} ${r.getAttribute('x')} ${r.getAttribute('y')})`);r.setAttribute('opacity',1)})}
 else if(sc.s==11.5){const k=ease((t-11.5)/2.2);A={x:540,y:1100+fl,s:1.4*back((t-12.8)/.6),o:cl((t-12.8)/.3)};
   [...fk.children].forEach((r,i)=>{const x0=540+Math.sin(i)*300,y0=800+Math.cos(i*1.7)*300;const x=lerp(x0,540+Math.sin(i*3)*80,k),y=lerp(y0,1100+Math.cos(i)*120,k);r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('transform',`rotate(${i*37+t*40} ${x} ${y})`);r.setAttribute('opacity',1-ease((t-13.5)/.6))})}
 else if(sc.s==15){A={x:540,y:1100+fl,s:1.4+0.25*ease((t-15)/3),o:1}}
 else {const k=ease((t-18.5)/.6);A={x:lerp(540,830,k),y:1150,s:lerp(1.65,.75,k),o:1};W={x:lerp(-700,-60,k),y:60,s:.9,o:k};glowK=ease((t-19.3)/1.2);
   const s=$('small');s.style.opacity=cl((t-21.5)/.4);s.style.top='1780px';s.textContent='está en la cesta 🛒'}
 if(sc.s!=5&&sc.s!=8.5){$('thread').setAttribute('opacity',0)} if(sc.s<8.5||sc.s>11.5){[...fk.children].forEach(r=>r.setAttribute('opacity',0))}
 if(sc.s!=0&&sc.s!=3)tf('worm',0,0,0,0,0); if(sc.s!=3&&sc.s!=5&&sc.s!=8.5)tf('coc',0,0,0,0,0);
 $('woman').setAttribute('transform',`translate(${W.x+540*(1-W.s)},${W.y+1000*(1-W.s)}) scale(${W.s})`);$('woman').setAttribute('opacity',W.o);
 const skin=mix('#E2BFA0','#F5C6A0',glowK);['head','earL','earR','neck','lidL','lidR'].forEach(i=>$(i).setAttribute('fill',skin));
 $('dry').setAttribute('opacity',0);['blL','blR'].forEach(i=>$(i).setAttribute('opacity',.25+.35*glowK));['hl','hl2'].forEach(i=>$(i).setAttribute('opacity',.8*glowK));
 $('spark').setAttribute('opacity',glowK);[1,2,3,4].forEach(i=>{const e=$('s'+i);const tr=e.getAttribute('transform').split(' scale')[0];e.setAttribute('transform',tr+` scale(${.6+.5*Math.abs(Math.sin(t*3+i))})`)});
 const cy=lerp(1110,1140,glowK);$('mouth').setAttribute('d',`M495,1095 Q540,${cy} 585,1095`);
 const bl=((t%3.2)>3.05)?54:0;['lidL','lidR'].forEach(i=>$(i).setAttribute('height',bl*2));
 tf('amp',A.x,A.y,A.s,Math.sin(t*1.5)*3,A.o);
 $('glow').style.opacity=.6+.3*Math.sin(t*1.5);
};
render(0);
</script></body></html>
