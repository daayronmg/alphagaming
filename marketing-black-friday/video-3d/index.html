<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0}body{width:1080px;height:1920px;overflow:hidden;background:#FBE3EC;font-family:'Inter','Noto Color Emoji',sans-serif}
canvas{position:absolute;inset:0}
#t{position:absolute;left:40px;right:40px;top:200px;text-align:center;font-family:'Inter Display','Inter','Noto Color Emoji';font-weight:900;font-size:110px;line-height:1.02;letter-spacing:-3px;color:#fff;-webkit-text-stroke:5px #C2185B;paint-order:stroke fill;opacity:0}
</style></head><body><div id="t"></div>
<script type="module">
import * as THREE from './three.module.min.js';
const W=1080,H=1920;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);
r.toneMapping=THREE.ACESFilmicToneMapping;r.outputColorSpace=THREE.SRGBColorSpace;r.shadowMap.enabled=true;document.body.prepend(r.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#F9D9E6');
const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);
scene.add(new THREE.HemisphereLight('#ffffff','#f3b6cf',1.6));
const key=new THREE.DirectionalLight('#ffffff',2.6);key.position.set(3,5,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const rim=new THREE.DirectionalLight('#ffd1e6',2.0);rim.position.set(-4,2,-3);scene.add(rim);
// label texture
const c=document.createElement('canvas');c.width=2048;c.height=1024;const g=c.getContext('2d');
const grd=g.createLinearGradient(0,0,2048,0);grd.addColorStop(0,'#E9A8C6');grd.addColorStop(.5,'#F6C6DA');grd.addColorStop(1,'#E9A8C6');g.fillStyle=grd;g.fillRect(0,0,2048,1024);
g.save();g.translate(1024+150,1000);g.rotate(-Math.PI/2);g.fillStyle='#fff';
g.font='700 120px Inter';g.fillText('medicube',0,0);g.font='600 46px Inter';g.fillText('PDRN PINK COLLAGEN',0,80);g.fillText('VOLUME MULTI BALM',0,135);g.font='400 30px Inter';g.fillText('10 g / 0.35 oz.',0,185);
g.font='800 150px Inter';g.fillText('5',770,-20);g.font='800 60px Inter';g.fillText('%',860,-75);g.font='700 30px Inter';g.fillText('VOLUFILINE',740,40);g.restore();
const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;
const stick=new THREE.Group();
const body=new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.42,2.2,96,1,false),[new THREE.MeshPhysicalMaterial({map:tex,roughness:.35,clearcoat:.8,clearcoatRoughness:.25}),new THREE.MeshPhysicalMaterial({color:'#EBB0CB',roughness:.4}),new THREE.MeshPhysicalMaterial({color:'#EBB0CB',roughness:.4})]);
body.castShadow=true;stick.add(body);
const collar=new THREE.Mesh(new THREE.CylinderGeometry(0.425,0.425,0.55,96),new THREE.MeshPhysicalMaterial({color:'#F7D3E2',transmission:.55,thickness:.3,roughness:.15,transparent:true,opacity:.9}));collar.position.y=1.37;stick.add(collar);
const balm=new THREE.Mesh(new THREE.CylinderGeometry(0.33,0.33,0.5,64),new THREE.MeshPhysicalMaterial({color:'#F8D7DF',roughness:.55,sheen:1,sheenColor:new THREE.Color('#fff')}));balm.position.y=1.85;stick.add(balm);
const dome=new THREE.Mesh(new THREE.SphereGeometry(0.33,64,32,0,Math.PI*2,0,Math.PI/2),balm.material);dome.scale.y=.35;dome.position.y=2.1;stick.add(dome);
stick.position.y=-0.6;scene.add(stick);
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,64),new THREE.ShadowMaterial({opacity:.18}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.72;floor.receiveShadow=true;scene.add(floor);
// sparkles
const sp=new THREE.Group();for(let i=0;i<40;i++){const m=new THREE.Mesh(new THREE.OctahedronGeometry(0.03+Math.random()*0.04),new THREE.MeshBasicMaterial({color:i%2?'#ffffff':'#FFD27A'}));m.userData={a:Math.random()*6.28,r:0.9+Math.random()*1.2,y:-1.5+Math.random()*4,s:0.3+Math.random()};sp.add(m)}scene.add(sp);
const T=[[0,'PARA. 🛑'],[1.6,'EL Nº1 DE TIKTOK EEUU 🇺🇸'],[3.6,'16,99 MILLONES $ 💸'],[5.6,'QUE NO TE LO CUENTEN 🤫']];
window.render=(t)=>{
 const k=Math.min(1,t/1.2),e=1-Math.pow(1-k,3);
 stick.rotation.y=t*1.4+ (1-e)*3; stick.rotation.z=Math.sin(t*1.2)*0.12; stick.position.y=-0.6+Math.sin(t*2)*0.08+(1-e)*-3;
 const d=lerp(9.5,7.2,Math.min(1,t/7)); cam.position.set(Math.sin(t*0.35)*1.2,0.9+Math.sin(t*.5)*.2,d); cam.lookAt(0,0.2,0);
 sp.children.forEach(m=>{const u=m.userData;m.position.set(Math.cos(u.a+t*u.s)*u.r,u.y+Math.sin(t+u.a)*.2,Math.sin(u.a+t*u.s)*u.r);m.rotation.set(t*2,t*3,0)});
 r.render(scene,cam);
 let cur=T[0];for(const x of T)if(t>=x[0])cur=x;const el=document.getElementById('t');el.textContent=cur[1];const lt=t-cur[0];el.style.opacity=Math.min(1,lt*6);el.style.transform=`scale(${1+0.5*Math.exp(-lt*14)})`;
};
function lerp(a,b,k){return a+(b-a)*k}
window.ready=true;
</script></body></html>
