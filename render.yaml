# Despliegue gratuito de ESTRELLA en Render (servidor) + Supabase (base de datos).
# Render: New → Blueprint → este repositorio. Solo pide DB_PASSWORD (contraseña del usuario estrella_app de Supabase).
services:
  - type: web
    name: estrella
    runtime: node
    plan: free
    region: frankfurt
    rootDir: estrella
    # NODE_ENV=production haría que npm omita las herramientas de compilación: se incluyen explícitamente
    buildCommand: npm ci --include=dev && npm exec -w web -- vite build
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: db
      - key: SEED_DEMO
        value: "1"
      - key: SUPABASE_PROJECT_REF
        value: vqkeegxhgcnnozvxthqf
      - key: SUPABASE_REGION
        value: eu-west-3
      - key: DB_USER
        value: estrella_app
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_PASSWORD
        sync: false
